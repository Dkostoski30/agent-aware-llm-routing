# Profile "demo": one larger model for the practical demo, where tool-use quality matters more than replica count (D8, D11).
model:
  # Better at multi-step tool use than the 0.6B. Qwen3-4B-AWQ did not fit (P0.3: 0.18 GiB of KV cache left, 1312
  # tokens), and the FP16 Qwen3-1.7B is 4 GB of weights; the Int8 1.7B is the largest that fits (D8).
  name: Qwen/Qwen3-1.7B-GPTQ-Int8
  # Hugging Face commit vLLM loads, so every run uses the same weights and chat template (versions.md, Models).
  revision: 382fed3fa21d1a7e837b42a500564a0c4be4f060
  # vLLM refuses to start if less than this share of VRAM is free; only ~3.22 of 4.0 GiB are free next to the Windows
  # desktop and the CUDA context, so 0.85 failed (P0.3). The KV cache size comes from kv_cache_memory_bytes.
  gpu_memory_utilization: 0.78
  # Set explicitly like in the other profiles. 800 MiB (7312 tokens, P0.3) is just under the 0.86 GiB vLLM derived from
  # 0.78 for this model in P0.3, so a busier desktop does not push the pod out of memory.
  kv_cache_memory_bytes: 838860800
  # Same context limit as the 0.6B, so the same agent tasks fit.
  max_model_len: 4096
  # vLLM parser that matches Qwen3's tool-call output format.
  tool_call_parser: hermes
# Only one 1.7B pod fits on the 4GB GPU (D8).
replicas: 1
# Kubernetes pod settings for the vLLM chart (P0.7).
pod:
  # vLLM became healthy 166 s in Docker (P0.3), almost all of it Python and process startup, not weights.
  # Probes start just before that, so a loading pod does not fill its events with failed probes; a slower pod
  # just becomes Ready a few probes later.
  readiness_initial_delay_seconds: 150
# Every routing rule is off until its task implements it; experiments turn rules on and off for ablation (D11).
routing:
  # Keeps steps 2..n of a run on the pod that has its context cached (P3.3).
  affinity: false
  # Moves a run off its pod only under sustained overload (P3.5).
  overload_guard: false
  # Lets calls of one parallel group spill to other pods under overload (P3.6).
  parallel_spill: false
  # Serves runs close to finishing first (P4.1).
  priority: false
  # Sends new runs to the newest pod right after scale-up (P4.2).
  warmup: false
# Prometheus settings (P1.1).
monitoring:
  # How often Prometheus reads every pod's /metrics, and so the finest time step of every metric an experiment reads
  # from it. 5 s: a request took 6-9 s under load (P0.4), so a queue that builds and drains within one request is
  # still seen; the Prometheus Operator default of 30 s would hide it.
  scrape_interval_seconds: 5
# Agent runtime (P1.3a).
agent:
  # vLLM constrains every call to the tool schemas and the run ends with final_answer: a malformed call is
  # impossible, which the demo's correctness needs most (D10). P1.6b compares both modes on this model.
  tool_choice: required
  # Safety cap only (D1): 5x the 2 calls the calculator task needs, so a model that keeps calling tools is stopped
  # well before it fills max_model_len.
  max_steps: 10
  # First guess, not measured: a run with three invalid calls (per run, not in a row) is not converging. P1.6b counts
  # the real retries per run.
  max_invalid_calls: 3
  # The calculator task "What is 7 times 8?": one tool call and the answer. The 0.6B cannot chain two operations
  # (P1.3b, experiments/log.md). P2.4 replaces it with a value per task type from recorded runs (D1); D13 updates it
  # once the scenario is picked.
  expected_steps_default: 2
  # Carried over from real: P0.4's p95 of 9.5 s (4 requests in flight per replica) was measured on the 0.6B, and the
  # 1.7B single replica is not measured under load yet (P1.6b). 120 s is still more than 10x that p95, so it bounds a
  # stuck call, not a slow one.
  llm_timeout_seconds: 120
  # How long Redis keeps a run's metadata and messages (D7). 24 h covers a whole demo or experiment day, so the
  # chat's step view (P3.13) still shows the steps of that day's runs; older chats keep their answers (SQLite) but
  # lose their steps. Redis has no persistence, so a restart drops the history earlier anyway.
  history_ttl_seconds: 86400
  # How often GET /runs/{id}/events reads the run from Redis for new steps (P1.4b-1). A trade-off between delay and
  # load: a step card lands at most this long after its step is saved, and every open stream reads the run's record
  # and messages from Redis once per poll. Only the UI opens streams, one per run on screen.
  events_poll_seconds: 0.25
  # Files never enter the context (D13); this bounds the run's files key in Redis and the tables the runtime parses
  # and keeps for the run. The request body is read whole before this check, so it does not cap the request's size.
  # 1 MiB holds a CSV of ~20,000 short rows, far more than a demo question needs.
  max_file_bytes: 1048576
  # Every file adds its ID and its columns to the tool schemas sent with every call, which share the 4096-token
  # context with the history; the demo attaches one or two.
  max_files: 5
  # First guess, not measured: a result row is ~20 tokens, so 20 rows is ~400 tokens and a few results fit in
  # max_model_len beside the prompt and the tool schemas (D13: only tool results enter the context). csv_summary
  # applies it to the columns it lists, one result row per column.
  max_result_rows: 20
  # CSV tool results are rounded to this many decimals before they enter the context: the model copies numbers as
  # it sees them (P1.6b: "17.833333333333332"). 2 keeps money exact and means readable; the rounding error of 0.005
  # stays inside the go/no-go's 1% tolerance for any value from 0.5 up.
  result_decimals: 2
  # P1.6b scores a final answer as correct when a number in it is within this share of the expected value. 1% passes
  # a tool result rounded to 3-4 significant digits (1,274.06 written as 1,274) and fails another group's value, which
  # the go/no-go fixture keeps more than 1% from every answer (experiments/demo-go-no-go.yaml).
  answer_tolerance: 0.01
  # Qwen3's recommended sampling for non-thinking mode (model card); thinking is off (CLAUDE.md).
  sampling:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
  # The same text in every profile, so recorded traces (real, sim) carry the prompt the demo sends. "Give the final
  # answer" fits both D10 modes: in required the model sees a final_answer tool, in auto it answers in text.
  system_prompt: |
    You are a data analysis agent. For questions about the attached CSV files use the csv_summary, group_by and
    compare tools; for any other arithmetic use the calculator tool, one operation per call. Every number in your
    answer must come from a tool result. When you know the result, give the final answer.
