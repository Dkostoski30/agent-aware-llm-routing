# Profile "sim": simulated pods (llm-d-inference-sim) calibrated from the real GPU, for autoscaling at scale (D4, D5, D11).
model:
  # Same model as "real": the simulator is calibrated from it, so the results stay comparable (D4).
  name: Qwen/Qwen3-0.6B-GPTQ-Int8
  # Same commit as "real", so the tokenizer and chat template match the calibration runs.
  revision: d3f20e7e71825fe57ad32705b396e9e156279107
  # Same as "real".
  gpu_memory_utilization: 0.42
  # Same as "real". The sim chart does not read it: a simulated pod's cache is simulator.kv_cache_blocks.
  kv_cache_memory_bytes: 503316480
  # Not "real"'s 4,384: a simulated pod holds simulator.kv_cache_blocks of block_size tokens, 512 x 16, which a test
  # holds this to. The cluster panel's cache pressure divides by it (P4.11).
  kv_cache_tokens: 8192
  # Same as "real", so the same traces fit within the context limit.
  max_model_len: 4096
  # Same as "real". The sim chart does not read it: no agent runs on this profile, and the simulator's replies
  # carry no tool calls the replayer reads.
  tool_call_parser: hermes
  # The simulator has no priority scheduling, and the sim chart does not read this: infra/routing-values.sh and
  # make experiment refuse the priority rule on any profile that is not priority (P4.1).
  scheduling_policy: fcfs
# Starts at the same size as "real"; autoscaling changes the count from here.
replicas: 2
# llm-d-inference-sim's behaviour (P2.7), calibrated on real pods (P2.8b): the timings come from the adapter's pods, as
# real serves them, measured on one pod alone, as a pod with its own GPU sees them (decided 2026-11-06). Measured again
# in P4.13b, on pods with compiled CUDA graphs and the compile cache. The files are
# sim/calibration-050859dea9d9-lora-1pod.csv (the table) and sim/cold-start-050859dea9d9-lora.csv;
# sim/calibrator/mapping.py turns them into these values and a test fails if they differ. What the simulator cannot
# express is in sim/calibration.md.
simulator:
  # Added once to a call's time to first token: the intercept of the least-squares line through the TTFT p50 of the
  # table's 12 concurrency-1 cells (all prompt lengths and cache modes) against their uncached tokens; the line misses a
  # cell by up to 65 ms. Eager pods' table (P2.8c, 5553d79b34d7) gave 298 ms.
  prefill_overhead: 127ms
  # Per uncached prompt token, which is how a prefix-cache hit saves time (D4): the slope of the same line, 0.091 ms.
  prefill_time_per_token: 91us
  # Per output token: the median per-token p50 of the same 12 cells, 12.1 ms (10.9-13.3). Eager pods gave 154.2.
  inter_token_latency: 12ms
  # 1.0 is no slowdown: the simulator scales every timing above linearly up to this factor at max_num_seqs running. The
  # table's median per-token p50 at concurrency 2 over that at 1: 13.0 / 12.1 = 1.08; concurrency 4 and 8 give 1.12 and
  # 1.20. Eager pods gave 0.99, kept at 1.0.
  time_factor_under_load: 1.08
  # Requests a pod runs at once; the rest wait in its queue. Real vLLM limits by KV tokens instead: 274 blocks, 4,384
  # tokens, and the converted trace P5 replays has a median prompt of 2,195 tokens (P2.4), so about 2 fit (decided
  # 2026-11-06). The table shows the real behaviour: past 4,384 tokens in flight, calls wait in rounds of what fits.
  max_num_seqs: 2
  # Not the real 274 blocks (4,384 tokens): a full cache makes the simulator answer HTTP 500 where real vLLM makes the
  # call wait, and two long prompts can fill 274. This is max_num_seqs x 256 blocks for a prompt of max_model_len, so a
  # call never fails that way; a test fails if it gets too small. The cost, a stated limitation: 1.9x the real cache, so
  # blocks are evicted later and hit rates can read higher than on real pods, which P2.9 measures (decided 2026-11-05).
  kv_cache_blocks: 512
  # vLLM's block size, so cached_tokens moves in the same steps as on a real pod.
  block_size: 16
  # A pod becomes Ready this long after it starts (D4): the median created-to-Ready of the 5 pods started alone, 140 s,
  # as autoscaling adds one, plus their first call's median TTFT of 1.04 s less a warm pod's 0.22 s (the line above at
  # the 1,024-token warm-up prompt). The simulator has no slow first call, so its pods turn Ready when a real pod first
  # answers at a warm pod's speed (decided 2026-11-06). Two pods starting at once on one GPU, which the simulator cannot
  # express, took 127-157 s. Without the compile cache a compiled pod took 254 s (P4.13b); eager pods gave 140 s.
  startup_duration: 141s
  # Any fixed value, for the same reply words on every run; the timings above have no random part (sim/calibration.md).
  seed: 1
# Every routing rule is off until its task implements it; experiments turn rules on and off for ablation (D11).
routing:
  # The thesis's plugin (P3.2). Off: the picker runs the chart's default-plugins.yaml, the default variant of Gate 2's
  # experiment files. On: infra/routing-values.sh writes thesis-plugins.yaml, the default's scorers behind
  # thesis-run-router, which reads the rules below. Off in every profile until Phase 4's demo needs it.
  plugin: false
  # Keeps steps 2..n of a run on the pod that has its context cached (P3.3).
  affinity: false
  # Sends one call of a pinned run to another pod when its pod is overloaded, and moves the run only when the overload
  # is sustained (P3.5). Acts on pinned runs only, so it needs affinity on.
  overload_guard: false
  # Keeps the calls of one parallel group on their run's pod while it has room for them, and sends the rest to pods
  # that have room (P3.6). Acts on pinned runs only, so it needs affinity on.
  parallel_spill: false
  # Sends a run's first call to the pod whose pinned runs have the least work left (P3.7b). Counts pinned runs, so it
  # needs affinity on.
  least_work_first: false
  # Sends a run's first call to the pod whose pinned runs' latest calls are the smallest in bytes, the context their
  # next calls bring to the pod's KV cache (P3.7b's second try). Needs affinity on, and not with least_work_first, which
  # places the same calls by remaining work. No threshold: sizes in bytes are almost never level.
  least_context_first: false
  # Serves runs close to finishing first (P4.1).
  priority: false
  # Sends a run's first call to the pods that just turned Ready, while they have room (P4.2).
  warmup: false
  # How long a run's pin outlives its last call when its end of run never arrives (P3.3, D1): the safety net for a
  # lost signal, not the way a pin normally goes. A first guess, longer than the longest call (agent.llm_timeout_seconds
  # 120) plus the gap after it (2 ms at most in the converted trace, a tool's time in a recorded one).
  run_ttl_seconds: 300
  # The overload guard (P3.5): a pinned run's call goes to another pod when its pod has more calls waiting than this
  # (vllm:num_requests_waiting, which on a real pod also holds the calls waiting for KV blocks). A first guess, which
  # P3.7 measures: 1 lets one call wait for a slot or KV blocks, and spills when a second would.
  overload_queue_threshold: 1
  # How long a pod must stay over the threshold before a run pinned to it moves to another pod; one run moves per
  # window, and spills carry the load meanwhile. A first guess, which P3.7 measures: several p50 calls of 2.3 s (P2.9),
  # so one long call is not sustained overload.
  overload_sustained_seconds: 10
  # The parallel rule (P3.6): a call of a parallel group stays on its run's pod while that pod's waiting queue plus the
  # group's calls already sent there and not ended are at or under this; otherwise it goes to another pod whose queue
  # is at or under it, and stays when there is none. A first guess, which P3.7 measures: 2 is a fan-out of 2
  # (replay.patterns) on a simulated pod that runs 2 at once (sim.yaml's max_num_seqs). With the overload guard on too,
  # the guard judges first and spills a call at a queue over 1 while another pod is at or under 1, so this rule then
  # finds a pod full only when every pod's queue is over 1.
  parallel_queue_threshold: 2
  # The least-work rule (P3.7b): a pod's work is the sum, over the live runs pinned to it, of max(expected - step, 1)
  # as of each run's latest call (D2's count). A run's first call goes to the lightest pod when every other pod has more
  # than this over it; pods within it are level and the default scorers choose among them. A first guess, in calls of
  # work: within 2 calls the scorers' pick by queue and prefix stands; P3.7's runs that started on the heavier pod were
  # 1-28 calls heavier, median 10-14 (experiments/log.md, P3.7b's spike).
  least_work_slack: 2
  # The priority rule's aging (P4.1): a call of a run close to finishing may go ahead of calls that arrived up to this
  # long before it, and no call is overtaken by one arriving more than this after it. A first guess, which P5.1
  # measures: about one median real run (27-29 s at Gate 2), so a run's first step can be overtaken only by calls that
  # arrive within one typical run after it.
  priority_aging_seconds: 30
  # Warm-up (P4.2): a pod is new this long after its Ready condition turned True. A first guess: one gap between the
  # bursts of replay.patterns.burst (every_seconds 120), so a pod added during one burst is still new at the next.
  warmup_seconds: 120
  # Warm-up (P4.2): a new pod with more calls waiting than this has no room, and a run's first call goes where the
  # scorers send it. A first guess, as overload_queue_threshold: 1 lets one call wait, so a burst can't pile onto a
  # cold pod.
  warmup_queue_threshold: 1
# KEDA on the vLLM Deployment for an experiment variant with an autoscaler (P3.9b, D2): infra/charts/autoscaling, from
# this section. A variant without one runs replicas pods. First guesses, which P3.9b's and P3.10's replays measure.
autoscaling:
  # The floor (decided 2026-11-09): one pod stays, so no run waits on a cold start from zero. A variant with an
  # autoscaler starts here, and its warm-up warms these pods.
  min_replicas: 1
  # The ceiling, a first guess (card 45): a simulated pod takes about 30 MiB, so 8 fit beside the rest of the VM.
  max_replicas: 8
  # Per pod, in calls of D2's remaining work, the sum of max(expected - step, 1) over active runs. A first guess: a pod
  # runs max_num_seqs 2 calls at once and a run of the burst pattern has one call in flight, so 2 runs fill it; over its
  # life a run has about half its expected steps left, ~5 for the converted trace's 9-12-step types, so 2 x 5.
  remaining_work_target: 10
  # Per pod, in calls waiting (vllm:num_requests_waiting): the queue autoscaler's threshold, and the moment P3.9b's
  # report holds remaining work to. A first guess, the overload guard's (routing.overload_queue_threshold): one call
  # may wait for a slot, a second is a queue.
  queue_target: 1
  # As real.yaml's (P4.12, P4.9's median bend), read here only for the report's context crossing: the pressure
  # autoscaler is refused on the simulator, which admits calls by max_num_seqs, not by KV blocks (P3.7b).
  pressure_target: 1.0
  # How long the HPA waits on lower readings before it removes pods. A first guess, the HPA's own default: it outlasts
  # the burst pattern's 120 s between bursts, so pods added for one are still there for the next. A pod removed
  # serves its calls first (drain, P4.3).
  scale_down_stabilization_seconds: 300
# Drain (P4.3): a simulated pod being removed (a scale-down, a restart) serves the calls it holds before it stops, as a
# real one does. The picker drops a pod from its pool as soon as its removal starts, so no new call reaches it; runs
# pinned to it move at once (docs/task-cards/59-P4.3-drain.md).
drain:
  # On in every profile: it changes no routing, it only stops a removed pod cutting its calls (llm-d-inference-sim
  # v1.0.0 waits for them 30 s on SIGTERM). Off only in an experiment's control variant.
  enabled: true
  # The longest a removed pod waits for its calls: the call deadline, agent.llm_timeout_seconds. A call on the pod at
  # its removal has at most that long before its client gives up, so a longer drain saves nothing and a shorter one may
  # cut a call still awaited. A test holds it at or above the deadline.
  timeout_seconds: 120
  # The pod counts as empty once its running and waiting calls have been 0 this long, so a call the picker sent just
  # before the pod left its pool, still on its way, is not cut. A first guess, P3.4's settle: the picker's informer
  # plus the 2.5 s the VM's wall clock can step.
  quiet_seconds: 5
# Prometheus settings (P1.1).
monitoring:
  # How often Prometheus reads every pod's /metrics, and so the finest time step of every metric an experiment reads
  # from it. 5 s: a request took 6-9 s under load (P0.4), so a queue that builds and drains within one request is
  # still seen; the Prometheus Operator default of 30 s would hide it.
  scrape_interval_seconds: 5
# Replayer: a trace's LLM calls straight to the gateway (P2.3, docs/task-cards/26-P2.3-replayer.md).
replay:
  # Same as "real", so a replay's arrivals and prompts are the same on simulated pods (P2.9 compares the two).
  # Any fixed value: the same seed gives the same runs, start times, prompts and fan-out picks. make replay SEED= picks
  # another, and P5's repetitions use one each.
  seed: 1
  # How far a replay's gap may be from the recorded one. Event-loop and network jitter, not the agent: the recorded gaps
  # are 1-21 ms with a median of 2 ms (P2.2b). A first guess with room: P2.3's replays stayed within 24 ms
  # (experiments/log.md).
  gap_tolerance_ms: 50
  # Where the replayer serves the run tracker's /metrics on the node while a replay runs (D2, P3.8); Prometheus scrapes it
  # through infra/manifests/replayer-metrics.yaml. Any port free on the node: k3s listens on 6443-6444, 10010 and
  # 10248-10259, vLLM's Docker container on 8000 (make up stops it).
  tracker_port: 9400
  # A replayed call is sent again as the agent's would be (agent.llm_retries and agent.llm_retry_backoff_seconds, P4.4),
  # so a replay fails a call when the agent it replays would. Replays before P4.4 never retried (experiments/log.md);
  # experiments/failover.yaml turns it off for its control.
  retry: true
  # How many tokens two runs have in common at the start of a prompt.
  shared_prefix_tokens:
    # Any two runs: none, although inside vLLM real runs of different types share their system prompt (192-256 tokens,
    # P2.2b). The picker hashes a request's tools first, then its messages (llm-d-router v0.11.0,
    # tokenizer/estimate.go), so in its view those runs share nothing. A replay sends no tools, so shared words at the
    # start would send every run to one pod (P2.3: 111 of 111 calls). The cost, a stated limitation: on the first call
    # after a pod switches type, up to 256 more uncached tokens, about 0.3 s at P2.2b's 1.19 ms per token.
    all_types: 0
    # Two runs of one task type. A trace with another type is refused. For the four recorded types (P2.2b): the system
    # prompt and that type's tool schemas, the lowest cached_tokens among the first steps that followed another run of the
    # type, a multiple of vLLM's 16-token block.
    by_type:
      csv: 752
      contracts: 736
      support: 800
      arithmetic: 336
      # The converted types (P2.4): the tokens all kept runs' first prompts have in common, at the type's factor, as make
      # convert printed it (experiments/results/traces/convert-apb-ca5fc26bbb1d-cd81f326aece.meta.json). The minimum over
      # the runs: any two of them may share more (experiments/log.md, bfcl).
      hotpotqa: 199
      gaia_dev: 190
      tau2_airline: 1649
      tau2_retail: 1628
      tau2_telecom: 1887
      bfcl: 227
  # Each pattern: runs started, their mean rate (Poisson, so the seed gives the times), optionally bursts of runs at
  # exact times and a fan_out. Rates are real.yaml's first guesses, for 2 real pods, not measured on this profile: a
  # recorded run takes ~22 s of calls one at a time (P2.2b).
  patterns:
    # A mean of one run per 20 s, and the done-when's 20 runs. So few runs leave the seed a say: they start 27.6 s
    # apart at seed 1 and 15.1-24.3 s at seeds 2-5, up to 1.8 times the load (P5). At seed 1 on 2 pods P2.3 measured
    # 0.7 calls in flight on average, at most 2, and 1.5-1.7, at most 5, while the host's clock was jumping (log).
    steady:
      runs: 20
      rate_per_second: 0.05
    # The base rate alone is 40% of steady's; every 2 min 5 runs arrive at once, meant to overload 2 pods. A first
    # guess: no replay has run this pattern yet, so the overload is not measured.
    burst:
      runs: 30
      rate_per_second: 0.02
      burst:
        runs: 5
        every_seconds: 120
    # The live check of fan-out through the gateway (P2.3): half of the later steps become 2 calls with one
    # x-parallel-group. 5 runs: a check of the headers, not a load, though P3.6's replay at seed 6 on sim spilled 1 of
    # its 47 calls, 4 of the 5 runs having started on one pod.
    steady-fan-out:
      runs: 5
      rate_per_second: 0.05
      fan_out:
        share: 0.5
        k: 2
    # P3.6's load: burst's arrivals with steady-fan-out's fan_out, so half of the later steps become 2 calls with one
    # x-parallel-group while the bursts load the pods. The same in every profile.
    burst-fan-out:
      runs: 30
      rate_per_second: 0.02
      burst:
        runs: 5
        every_seconds: 120
      fan_out:
        share: 0.5
        k: 2
    # For the converted traces (P2.4), whose runs are longer, so steady's rate would likely overload 2 pods. A first guess,
    # not the same load as steady: on 2 pods at seed 6, the done-when's by its rule for a mix of types, it measured 1.68 calls
    # in flight on average, at most 5, slowest 87 s, against steady's 0.70 at seed 1 (log). 20 of 879 runs leave the seed a
    # say: seeds 1-12 give 81-167 calls.
    steady-long:
      runs: 20
      rate_per_second: 0.02
    # P2.5's experiments/baseline.yaml: steady-long's measured rate with twice the runs, as 20 of 879 leave the seed a big
    # say. At its seed 6 the first 20 are the runs and start times of P2.4's replay, so the load is known: 1.68 calls in
    # flight on average, at most 5 (log). The later runs make that a first guess.
    baseline:
      runs: 40
      rate_per_second: 0.02
# Agent runtime (P1.3a).
agent:
  # The model calls a tool or answers in plain text, like a real agent; the runtime checks every call and retries
  # invalid ones, so the recorded traffic keeps the shape of real agent traffic (D10).
  tool_choice: auto
  # Safety cap only (D1): 5x the 2 calls the calculator task needs, so a model that keeps calling tools is stopped
  # well before it fills max_model_len.
  max_steps: 10
  # First guess, not measured: a run with three invalid calls (per run, not in a row) is not converging. P1.6b counts
  # the real retries per run.
  max_invalid_calls: 3
  # The calculator task "What is 7 times 8?": one tool call and the answer. The 0.6B cannot chain two operations
  # (P1.3b, experiments/log.md). What a run sends until it knows its scenario (D13).
  expected_steps_default: 2
  # Each task type's median calls per run, rounded up (D1, loadgen/load_generator/expected_steps.py), over the traces in
  # experiments/results/traces/: record-demo-e1044feb534c-c5cf306f32ee-e03c0981507c.jsonl for the first four
  # (P4.8b's recording, whose runs start with step 1's pick), convert-apb-ca5fc26bbb1d-cd81f326aece.jsonl for the
  # others. A test fails if these differ. The runtime sends its scenario's from step 2, once step 1 has picked it (D13,
  # P4.8); make convert writes them into its traces. P2.2b's recording, without the pick, stays for the experiments
  # that replayed it and no longer counts.
  expected_steps_by_type:
    csv: 3
    contracts: 4
    support: 4
    arithmetic: 3
    hotpotqa: 2
    gaia_dev: 4
    tau2_airline: 9
    tau2_retail: 10
    tau2_telecom: 12
    bfcl: 9
  # Step 1 of every run (D13, P4.8): the last message of its prompt, after the task. vLLM's structured outputs keep the
  # reply to the scenarios the run's files can feed (agent_runtime/tools.py, scenarios), so the text only says what
  # each means. The same text in every profile, as the system prompt.
  scenario_prompt: |
    Which scenario does the last question belong to? csv: a question about attached CSV files. contracts: a question
    about attached contracts or documents. support: a customer asking about one of their orders. arithmetic:
    arithmetic without attached files. out_of_scope: anything else.
  # The answer of a run whose step 1 picked out_of_scope, word for word, with no tool call (P1.6e's sentence, decided
  # with the user 2026-10-28; orders and contracts added in P2.1b). Moved here from experiments/finetune-data.yaml in
  # P4.8, so the runtime sends the sentence the adapter is trained on.
  out_of_scope_reply: I can only do arithmetic and answer questions about attached CSV files, orders and contracts.
  # The chat's earlier turns a run's prompt may hold, in tokens (D13, agent_runtime/history.py): model.max_model_len
  # less the longest call of P2.2b's demo trace (record-demo-e1044feb534c-d86ed436c5b2-...: a support run's step 3,
  # 1,277 prompt and 142 reply tokens), so a run never overflows because of its history. 4,096 - 1,419 = 2,677,
  # rounded down. P4.8b's trace above is shorter (a support run's step 4, 1,075 and 142), so the budget stays. Step 1's
  # prompt has no tools, so it is shorter than any later step's.
  history_budget_tokens: 2600
  # Bounds a stuck call, not a latency target: P0.4 measured p95 9.5 s with 4 requests in flight per replica. Under
  # load a call that is still answering can come close (P2.3's slowest took 106 s on a slowed host, 41 s otherwise),
  # and the replayer holds the whole call to it, so an overloaded pod's longest calls fail first, which P3.4's and
  # P4.4's counts must allow for.
  llm_timeout_seconds: 120
  # A call whose pod died is sent again with the same step and history (P4.4, agent_runtime/retry.py): on no connection,
  # a connection cut or a 5xx from the gateway, never on the deadline above, which means overload. 2: one for the dead
  # pod, one for a retry the picker sent there before it learned the pod had left. A first guess.
  llm_retries: 2
  # The wait before each retry: P3.4's settle, the picker's informer dropping the dead pod (experiments/pod-removed.yaml).
  llm_retry_backoff_seconds: 5
  # How long Redis keeps a run's metadata and messages (D7). 24 h covers a whole demo or experiment day, so the
  # chat's step view (P3.13) still shows the steps of that day's runs; older chats keep their answers (SQLite) but
  # lose their steps. Redis has no persistence, so a restart drops the history earlier anyway.
  history_ttl_seconds: 86400
  # How often GET /runs/{id}/events reads the run from Redis for new steps (P1.4b-1). A trade-off between delay and
  # load: a step card lands at most this long after its step is saved, and every open stream reads the run's record
  # and messages from Redis once per poll. Only the UI opens streams, one per run on screen.
  events_poll_seconds: 0.25
  # Files never enter the context (D13); this bounds the run's files key in Redis and the tables the runtime parses
  # and keeps for the run. The request body is read whole before this check, so it does not cap the request's size.
  # 1 MiB holds a CSV of ~20,000 short rows, far more than a demo question needs.
  max_file_bytes: 1048576
  # Every file adds its ID and its columns to the tool schemas sent with every call, which share the 4096-token
  # context with the history; the demo attaches one or two.
  max_files: 5
  # First guess, not measured: a result row is ~20 tokens, so 20 rows is ~400 tokens and a few results fit in
  # max_model_len beside the prompt and the tool schemas (D13: only tool results enter the context). csv_summary
  # applies it to the columns it lists, one result row per column.
  max_result_rows: 20
  # Bounds the group names group_by and compare's error list, which a row count does not (P2.6c): 20 IDs of 68 random
  # characters took ~1,000 tokens in run-e3ed93177366, ~1.4 characters per token, not the ~20 tokens a row above.
  # 560 is ~400 tokens at that rate, the same budget. It changes nothing the adapter was trained on: the longest
  # list in the 10,000 group_by results of the P1.7 data is 35 characters.
  max_result_chars: 560
  # CSV tool results are rounded to this many decimals before they enter the context: the model copies numbers as
  # it sees them (P1.6b: "17.833333333333332"). 2 keeps money exact and means readable; the rounding error of 0.005
  # stays inside the go/no-go's 1% tolerance for any value from 0.5 up.
  result_decimals: 2
  # Bounds one clause body in the context (D13: documents never enter it, only tool results do). ~4 characters per
  # token puts 1600 at ~400 tokens, the budget max_result_rows gives a CSV result; extract_clauses cuts a longer
  # clause and says so, and diff_clauses cuts each side of a changed passage the same way (P2.1a-1).
  max_clause_chars: 1600
  # Bounds a diff_clauses summary: a change with its context is ~20 tokens, so 20 changes are ~400 tokens, the same
  # budget as max_result_rows. The summary still counts every change.
  max_diff_changes: 20
  # Unchanged words diff_clauses shows on each side of a change, so its summary reads "with 30 days' written" became
  # "with 60 days' written" and the model can say what changed, not only "30" became "60" (decided 2026-11-01).
  # Changes closer than twice this are one passage.
  diff_context_words: 3
  # Qwen3's recommended sampling for non-thinking mode (model card); thinking is off (CLAUDE.md).
  sampling:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
  # The same text in every profile, so recorded traces (real, sim) carry the prompt the demo sends. "Give the final
  # answer" fits both D10 modes: in required the model sees a final_answer tool, in auto it answers in text.
  system_prompt: |
    You are a data analysis agent. When a customer asks about one of their orders, use get_order to look up the
    order, get_policy to read the policy that applies, and draft_reply to write the reply to the customer. For other
    questions about the attached CSV files use the csv_summary, group_by and compare tools; for questions about
    attached contracts use read_document to list a contract's clauses, extract_clauses to read one clause, and
    diff_clauses to compare a clause between two contracts. For arithmetic questions without attached files call the
    calculator tool once with the whole expression. Every number in your answer must come from a tool result. When
    you know the result, give the final answer.
# The app backend: users, sessions and chats in SQLite (D7, P2.10a).
app:
  # A login lasts this long from login, not from the last request: one demo day, so nobody is logged out mid-demo,
  # and a copied cookie stops working by the next day.
  session_ttl_seconds: 86400
  # Password hashing cost for hashlib.scrypt. OWASP's Password Storage Cheat Sheet lists N=2^14, r=8, p=5 as equal to
  # its N=2^17, r=8, p=1 minimum; it needs 16 MiB (128 * r * N bytes), under the 32 MiB OpenSSL allows by default.
  # Each hash stores the cost it was made with, so a change here applies only to passwords set afterwards.
  scrypt:
    n: 16384
    r: 8
    p: 5
  # 8, the user's choice on 2026-11-18, so a password is quick to type during the demo. NIST SP 800-63B-4 asks for 15
  # when the password is the only factor, as it is here, so this is below it; like NIST, no rule on capitals or symbols.
  min_password_length: 8
  # The session cookie travels over HTTPS only. Browsers treat http://localhost as secure, so the port-forwarded app
  # still works; false only to open the app over plain HTTP under another host name.
  cookie_secure: true
  # How long the app waits for the agent runtime's POST /runs and GET /runs/{id} (P3.12a). Both answer from Redis
  # without waiting on the model, POST /runs after counting the chat's history with /tokenize, one short request per
  # turn to the pods' API server (P4.8). httpx's default of 5 s, which the agent's call to the picker also uses, is far
  # above them; past it the message gets a failed reply (502) or a read leaves the reply running.
  runtime_timeout_seconds: 5
  # The cluster panel shows the cache pressure in the warning colour from here up (P4.11): at 1 the active runs' context
  # fills the ready pods' KV cache on paper, and P4.9's median first token bent there (0.4 s under 0.75, 1.7 s at
  # 1-1.25 on the real-pod replays).
  pressure_warn: 1.0
  # The cluster panel's two demo buttons (P4.6a): Start replays the recorded demo trace with one of these patterns, Kill
  # force-deletes a vLLM pod, both run on the host by make demo-runner, which the app backend asks.
  demo_controls:
    # Off: make up deploys no app backend on sim (P2.10b), so no panel shows the buttons.
    enabled: false
    # Where make demo-runner listens on the node; the app backend reaches it through infra/manifests/demo-runner.yaml.
    # Any port free on the node beside replay.tracker_port (9400), which the replay the runner starts listens on.
    runner_port: 9401
    # The demo scenarios' runs recorded on the real model, each starting with step 1's pick (P4.8b): its csv,
    # contracts, support and arithmetic runs are what the chat itself answers.
    trace: experiments/results/traces/record-demo-e1044feb534c-c5cf306f32ee-e03c0981507c.jsonl
    # Names in replay.patterns: steady is the row's 20 tasks, burst the load that spills and queues (P3.6).
    patterns: [steady, burst]
