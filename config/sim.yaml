# Profile "sim": simulated pods (llm-d-inference-sim) calibrated from the real GPU, for autoscaling at scale (D4, D5, D11).
model:
  # Same model as "real": the simulator is calibrated from it, so the results stay comparable (D4).
  name: Qwen/Qwen3-0.6B-GPTQ-Int8
  # Same commit as "real", so the tokenizer and chat template match the calibration runs.
  revision: d3f20e7e71825fe57ad32705b396e9e156279107
  # Same as "real".
  gpu_memory_utilization: 0.42
  # Same as "real". The sim chart does not read it: a simulated pod's cache is simulator.kv_cache_blocks.
  kv_cache_memory_bytes: 503316480
  # Same as "real", so the same traces fit within the context limit.
  max_model_len: 4096
  # Same as "real". The sim chart does not read it: no agent runs on this profile, and the simulator's replies
  # carry no tool calls the replayer reads.
  tool_call_parser: hermes
# Starts at the same size as "real"; autoscaling changes the count from here.
replicas: 2
# llm-d-inference-sim's behaviour (P2.7), calibrated on real pods (P2.8b): the timings come from the adapter's pods, as
# real serves them, measured on one pod alone, as a pod with its own GPU sees them (decided 2026-11-06). The files are
# sim/calibration-5553d79b34d7-lora-1pod.csv (the table) and sim/cold-start-5553d79b34d7-lora.csv;
# sim/calibrator/mapping.py turns them into these values and a test fails if they differ. What the simulator cannot
# express is in sim/calibration.md.
simulator:
  # Added once to a call's time to first token: the intercept of the least-squares line through the TTFT p50 of the
  # table's 12 concurrency-1 cells (all prompt lengths and cache modes) against their uncached tokens; the line misses a
  # cell by up to 95 ms. The table was measured again in P2.8c, after P2.9's first run missed (experiments/log.md).
  prefill_overhead: 298ms
  # Per uncached prompt token, which is how a prefix-cache hit saves time (D4): the slope of the same line, 0.146 ms.
  prefill_time_per_token: 146us
  # Per output token: the median per-token p50 of the same 12 cells, 154.2 ms (147-186). P2.8a's table gave 190.6 from
  # a slow stretch that did not come back; P2.9's first real replay generated at 123.1 ms (sim/calibration.md).
  inter_token_latency: 154ms
  # 1.0 is no slowdown: the simulator scales every timing above linearly up to this factor at max_num_seqs running. The
  # table's median per-token p50 at concurrency 2 over that at 1 is 152.9 / 154.2 = 0.99, and a pod is not faster
  # under load, so the mapping keeps 1.0; concurrency 4 and 8 give 1.02 and 1.01.
  time_factor_under_load: 1.0
  # Requests a pod runs at once; the rest wait in its queue. Real vLLM limits by KV tokens instead: 274 blocks, 4,384
  # tokens, and the converted trace P5 replays has a median prompt of 2,195 tokens (P2.4), so about 2 fit (decided
  # 2026-11-06). The table shows the real behaviour: past 4,384 tokens in flight, calls wait in rounds of what fits.
  max_num_seqs: 2
  # Not the real 274 blocks (4,384 tokens): a full cache makes the simulator answer HTTP 500 where real vLLM makes the
  # call wait, and two long prompts can fill 274. This is max_num_seqs x 256 blocks for a prompt of max_model_len, so a
  # call never fails that way; a test fails if it gets too small. The cost, a stated limitation: 1.9x the real cache, so
  # blocks are evicted later and hit rates can read higher than on real pods, which P2.9 measures (decided 2026-11-05).
  kv_cache_blocks: 512
  # vLLM's block size, so cached_tokens moves in the same steps as on a real pod.
  block_size: 16
  # A pod becomes Ready this long after it starts (D4): the median created-to-Ready of the 5 pods started alone, 126 s,
  # as autoscaling adds one, plus their first call's median TTFT of 14.3 s less a warm pod's 0.45 s (the line above at
  # the 1,024-token warm-up prompt). The simulator has no slow first call, so its pods turn Ready when a real pod first
  # answers at a warm pod's speed (decided 2026-11-06). Two pods starting at once on one GPU, which the simulator cannot
  # express, took 124-143 s.
  startup_duration: 140s
  # Any fixed value, for the same reply words on every run; the timings above have no random part (sim/calibration.md).
  seed: 1
# Every routing rule is off until its task implements it; experiments turn rules on and off for ablation (D11).
routing:
  # The thesis's plugin (P3.2). Off: the picker runs the chart's default-plugins.yaml, the default variant of Gate 2's
  # experiment files. On: infra/routing-values.sh writes thesis-plugins.yaml, the default's scorers behind
  # thesis-run-router, which reads the rules below. Off in every profile until Phase 4's demo needs it.
  plugin: false
  # Keeps steps 2..n of a run on the pod that has its context cached (P3.3).
  affinity: false
  # Moves a run off its pod only under sustained overload (P3.5).
  overload_guard: false
  # Lets calls of one parallel group spill to other pods under overload (P3.6).
  parallel_spill: false
  # Serves runs close to finishing first (P4.1).
  priority: false
  # Sends new runs to the newest pod right after scale-up (P4.2).
  warmup: false
  # How long a run's pin outlives its last call when its end of run never arrives (P3.3, D1): the safety net for a
  # lost signal, not the way a pin normally goes. A first guess, longer than the longest call (agent.llm_timeout_seconds
  # 120) plus the gap after it (2 ms at most in the converted trace, a tool's time in a recorded one).
  run_ttl_seconds: 300
# Prometheus settings (P1.1).
monitoring:
  # How often Prometheus reads every pod's /metrics, and so the finest time step of every metric an experiment reads
  # from it. 5 s: a request took 6-9 s under load (P0.4), so a queue that builds and drains within one request is
  # still seen; the Prometheus Operator default of 30 s would hide it.
  scrape_interval_seconds: 5
# Replayer: a trace's LLM calls straight to the gateway (P2.3, docs/task-cards/26-P2.3-replayer.md).
replay:
  # Same as "real", so a replay's arrivals and prompts are the same on simulated pods (P2.9 compares the two).
  # Any fixed value: the same seed gives the same runs, start times, prompts and fan-out picks. make replay SEED= picks
  # another, and P5's repetitions use one each.
  seed: 1
  # How far a replay's gap may be from the recorded one. Event-loop and network jitter, not the agent: the recorded gaps
  # are 1-21 ms with a median of 2 ms (P2.2b). A first guess with room: P2.3's replays stayed within 24 ms
  # (experiments/log.md).
  gap_tolerance_ms: 50
  # How many tokens two runs have in common at the start of a prompt.
  shared_prefix_tokens:
    # Any two runs: none, although inside vLLM real runs of different types share their system prompt (192-256 tokens,
    # P2.2b). The picker hashes a request's tools first, then its messages (llm-d-router v0.11.0,
    # tokenizer/estimate.go), so in its view those runs share nothing. A replay sends no tools, so shared words at the
    # start would send every run to one pod (P2.3: 111 of 111 calls). The cost, a stated limitation: on the first call
    # after a pod switches type, up to 256 more uncached tokens, about 0.3 s at P2.2b's 1.19 ms per token.
    all_types: 0
    # Two runs of one task type. A trace with another type is refused. For the four recorded types (P2.2b): the system
    # prompt and that type's tool schemas, the lowest cached_tokens among the first steps that followed another run of the
    # type, a multiple of vLLM's 16-token block.
    by_type:
      csv: 752
      contracts: 736
      support: 800
      arithmetic: 336
      # The converted types (P2.4): the tokens all kept runs' first prompts have in common, at the type's factor, as make
      # convert printed it (experiments/results/traces/convert-apb-ca5fc26bbb1d-cd81f326aece.meta.json). The minimum over
      # the runs: any two of them may share more (experiments/log.md, bfcl).
      hotpotqa: 199
      gaia_dev: 190
      tau2_airline: 1649
      tau2_retail: 1628
      tau2_telecom: 1887
      bfcl: 227
  # Each pattern: runs started, their mean rate (Poisson, so the seed gives the times), optionally bursts of runs at
  # exact times and a fan_out. Rates are real.yaml's first guesses, for 2 real pods, not measured on this profile: a
  # recorded run takes ~22 s of calls one at a time (P2.2b).
  patterns:
    # A mean of one run per 20 s, and the done-when's 20 runs. So few runs leave the seed a say: they start 27.6 s
    # apart at seed 1 and 15.1-24.3 s at seeds 2-5, up to 1.8 times the load (P5). At seed 1 on 2 pods P2.3 measured
    # 0.7 calls in flight on average, at most 2, and 1.5-1.7, at most 5, while the host's clock was jumping (log).
    steady:
      runs: 20
      rate_per_second: 0.05
    # The base rate alone is 40% of steady's; every 2 min 5 runs arrive at once, meant to overload 2 pods. A first
    # guess: no replay has run this pattern yet, so the overload is not measured.
    burst:
      runs: 30
      rate_per_second: 0.02
      burst:
        runs: 5
        every_seconds: 120
    # The live check of fan-out through the gateway (P2.3): half of the later steps become 2 calls with one
    # x-parallel-group. 5 runs: a check of the headers, not a load. P3.6 adds its own burst with a fan_out.
    steady-fan-out:
      runs: 5
      rate_per_second: 0.05
      fan_out:
        share: 0.5
        k: 2
    # For the converted traces (P2.4), whose runs are longer, so steady's rate would likely overload 2 pods. A first guess,
    # not the same load as steady: on 2 pods at seed 6, the done-when's by its rule for a mix of types, it measured 1.68 calls
    # in flight on average, at most 5, slowest 87 s, against steady's 0.70 at seed 1 (log). 20 of 879 runs leave the seed a
    # say: seeds 1-12 give 81-167 calls.
    steady-long:
      runs: 20
      rate_per_second: 0.02
    # P2.5's experiments/baseline.yaml: steady-long's measured rate with twice the runs, as 20 of 879 leave the seed a big
    # say. At its seed 6 the first 20 are the runs and start times of P2.4's replay, so the load is known: 1.68 calls in
    # flight on average, at most 5 (log). The later runs make that a first guess.
    baseline:
      runs: 40
      rate_per_second: 0.02
# Agent runtime (P1.3a).
agent:
  # The model calls a tool or answers in plain text, like a real agent; the runtime checks every call and retries
  # invalid ones, so the recorded traffic keeps the shape of real agent traffic (D10).
  tool_choice: auto
  # Safety cap only (D1): 5x the 2 calls the calculator task needs, so a model that keeps calling tools is stopped
  # well before it fills max_model_len.
  max_steps: 10
  # First guess, not measured: a run with three invalid calls (per run, not in a row) is not converging. P1.6b counts
  # the real retries per run.
  max_invalid_calls: 3
  # The calculator task "What is 7 times 8?": one tool call and the answer. The 0.6B cannot chain two operations
  # (P1.3b, experiments/log.md). What a run sends until it knows its scenario (D13).
  expected_steps_default: 2
  # Each task type's median calls per run, rounded up (D1, loadgen/load_generator/expected_steps.py), over the traces in
  # experiments/results/traces/: record-demo-e1044feb534c-d86ed436c5b2-5554fcf81b09.jsonl for the first four,
  # convert-apb-ca5fc26bbb1d-cd81f326aece.jsonl for the others. A test fails if these differ. The runtime sends them once P4.8 knows
  # the scenario; make convert writes them into its traces now.
  expected_steps_by_type:
    csv: 2
    contracts: 3
    support: 3
    arithmetic: 2
    hotpotqa: 2
    gaia_dev: 4
    tau2_airline: 9
    tau2_retail: 10
    tau2_telecom: 12
    bfcl: 9
  # Bounds a stuck call, not a latency target: P0.4 measured p95 9.5 s with 4 requests in flight per replica. Under
  # load a call that is still answering can come close (P2.3's slowest took 106 s on a slowed host, 41 s otherwise),
  # and the replayer holds the whole call to it, so an overloaded pod's longest calls fail first, which P3.4's and
  # P4.4's counts must allow for.
  llm_timeout_seconds: 120
  # How long Redis keeps a run's metadata and messages (D7). 24 h covers a whole demo or experiment day, so the
  # chat's step view (P3.13) still shows the steps of that day's runs; older chats keep their answers (SQLite) but
  # lose their steps. Redis has no persistence, so a restart drops the history earlier anyway.
  history_ttl_seconds: 86400
  # How often GET /runs/{id}/events reads the run from Redis for new steps (P1.4b-1). A trade-off between delay and
  # load: a step card lands at most this long after its step is saved, and every open stream reads the run's record
  # and messages from Redis once per poll. Only the UI opens streams, one per run on screen.
  events_poll_seconds: 0.25
  # Files never enter the context (D13); this bounds the run's files key in Redis and the tables the runtime parses
  # and keeps for the run. The request body is read whole before this check, so it does not cap the request's size.
  # 1 MiB holds a CSV of ~20,000 short rows, far more than a demo question needs.
  max_file_bytes: 1048576
  # Every file adds its ID and its columns to the tool schemas sent with every call, which share the 4096-token
  # context with the history; the demo attaches one or two.
  max_files: 5
  # First guess, not measured: a result row is ~20 tokens, so 20 rows is ~400 tokens and a few results fit in
  # max_model_len beside the prompt and the tool schemas (D13: only tool results enter the context). csv_summary
  # applies it to the columns it lists, one result row per column.
  max_result_rows: 20
  # Bounds the group names group_by and compare's error list, which a row count does not (P2.6c): 20 IDs of 68 random
  # characters took ~1,000 tokens in run-e3ed93177366, ~1.4 characters per token, not the ~20 tokens a row above.
  # 560 is ~400 tokens at that rate, the same budget. It changes nothing the adapter was trained on: the longest
  # list in the 10,000 group_by results of the P1.7 data is 35 characters.
  max_result_chars: 560
  # CSV tool results are rounded to this many decimals before they enter the context: the model copies numbers as
  # it sees them (P1.6b: "17.833333333333332"). 2 keeps money exact and means readable; the rounding error of 0.005
  # stays inside the go/no-go's 1% tolerance for any value from 0.5 up.
  result_decimals: 2
  # Bounds one clause body in the context (D13: documents never enter it, only tool results do). ~4 characters per
  # token puts 1600 at ~400 tokens, the budget max_result_rows gives a CSV result; extract_clauses cuts a longer
  # clause and says so, and diff_clauses cuts each side of a changed passage the same way (P2.1a-1).
  max_clause_chars: 1600
  # Bounds a diff_clauses summary: a change with its context is ~20 tokens, so 20 changes are ~400 tokens, the same
  # budget as max_result_rows. The summary still counts every change.
  max_diff_changes: 20
  # Unchanged words diff_clauses shows on each side of a change, so its summary reads "with 30 days' written" became
  # "with 60 days' written" and the model can say what changed, not only "30" became "60" (decided 2026-11-01).
  # Changes closer than twice this are one passage.
  diff_context_words: 3
  # Qwen3's recommended sampling for non-thinking mode (model card); thinking is off (CLAUDE.md).
  sampling:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
  # The same text in every profile, so recorded traces (real, sim) carry the prompt the demo sends. "Give the final
  # answer" fits both D10 modes: in required the model sees a final_answer tool, in auto it answers in text.
  system_prompt: |
    You are a data analysis agent. When a customer asks about one of their orders, use get_order to look up the
    order, get_policy to read the policy that applies, and draft_reply to write the reply to the customer. For other
    questions about the attached CSV files use the csv_summary, group_by and compare tools; for questions about
    attached contracts use read_document to list a contract's clauses, extract_clauses to read one clause, and
    diff_clauses to compare a clause between two contracts. For arithmetic questions without attached files call the
    calculator tool once with the whole expression. Every number in your answer must come from a tool result. When
    you know the result, give the final answer.
# The app backend: users, sessions and chats in SQLite (D7, P2.10a).
app:
  # A login lasts this long from login, not from the last request: one demo day, so nobody is logged out mid-demo,
  # and a copied cookie stops working by the next day.
  session_ttl_seconds: 86400
  # Password hashing cost for hashlib.scrypt. OWASP's Password Storage Cheat Sheet lists N=2^14, r=8, p=5 as equal to
  # its N=2^17, r=8, p=1 minimum; it needs 16 MiB (128 * r * N bytes), under the 32 MiB OpenSSL allows by default.
  # Each hash stores the cost it was made with, so a change here applies only to passwords set afterwards.
  scrypt:
    n: 16384
    r: 8
    p: 5
  # NIST SP 800-63B-4: at least 15 characters when the password is the only factor, as it is here.
  min_password_length: 15
  # The session cookie travels over HTTPS only. Browsers treat http://localhost as secure, so the port-forwarded app
  # still works; false only to open the app over plain HTTP under another host name.
  cookie_secure: true
