# P4.4: a pod killed partway through a replay on simulated pods, with the replay's retry off (the replay as before
# P4.4, the control) and on (docs/task-cards/60-P4.4-failover.md). Run with make failover-check
# EXPERIMENT=experiments/failover.yaml after make down and make up PROFILE=sim. The question: how many runs complete
# when a call's pod dies under it? Results carry this file's hash (D11).
# First run 2026-11-20 (failover-576b813b6b4c, kept): retry-on lost 2 runs whose streams the gateway ended cleanly
# when the pod died, which the replay did not then count as a cut; replay.py now does (experiments/log.md).
profile: sim
# The plugin with affinity, so the pod killed is the one most runs are pinned to, and the runs it held are counted.
routing:
  plugin: true
  affinity: true
# P4.3's replay (experiments/drain.yaml), P3.9b's: the long runs, the burst pattern, the seed. The profile's 2 pods,
# no autoscaler; the ReplicaSet replaces the killed pod, which the simulator's 140 s cold start keeps out of the burst.
trace: results/traces/convert-apb-ca5fc26bbb1d-cd81f326aece.jsonl
pattern: burst
seed: 6
# 5 s into the first burst, as P4.3's scale-down: at seed 6 runs start at 0, 52.5, 79.5 and 108.6 s, then 5 at 120 s
# and one at 121.5 s (plan.start_times), so the pod killed holds running and waiting calls.
kill_after_seconds: 125
# How long the kill waits for a pod holding a live pin before the variant reports void: one burst's runs last longer
# than this, so a pod with a pin is found unless the replay is idle.
wait_for_calls_seconds: 60
# P3.4's settle: the picker's informer plus the 2.5 s the VM's wall clock can step (P2.3).
settle_seconds: 5
variants:
  - name: retry-off
    retry: false
  - name: retry-on
    retry: true
