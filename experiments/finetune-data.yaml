# P1.7 step 2: the generated data (docs/task-cards/19-P1.7-fine-tune-tool-calls.md). make finetune-data writes the
# training examples and the held-out questions to <output_dir>/<first 12 hex digits of this file's sha256>/, so a
# changed file never mixes with an old one's data, and results are stamped with that hash (D11).
output_dir: ~/.cache/thesis/finetune/data
# The profile whose agent settings the trajectories are run with (system_prompt, result_decimals, max_result_rows,
# max_files, answer_tolerance): the one that serves the adapter (finetune-train.yaml, served_profile).
profile: real
# The training examples teach both D10 modes, and the held-out set is scored in both, as the go/no-go is.
modes: [required, auto]
# One seed per split, so changing one split's size does not change the other's draws.
seeds:
  train: 1
  heldout: 2
# CSVs per split. Each holds dozens of possible questions per kind; 60 and 30 give every kind many files, so no kind
# leans on a few tables.
csvs:
  train: 60
  heldout: 30
# Questions per kind; each becomes one trajectory per mode. Held-out: 14 per kind, 98 questions, 196 runs, ~40 min per
# pass (decided with the user 2026-10-30, down from 100 per kind and 4-6 h): ±10 points per mode at 95%, enough for a
# clear overall gain; per kind (±26) only a hint. Training: 100 per kind (decided with the user 2026-10-30, down from
# 400 and ~12,800 examples, a night per epoch): ~3,200 examples, ~45 min per epoch at step 1's ~1 s per example
# (experiments/log.md). A narrow format (which tool, which enum arguments) is learned from a few thousand examples;
# raise it if the adapter underfits.
questions:
  train: 100
  heldout: 14
# The shape of every generated CSV, like experiments/data/sales.csv: one row per combination of the text columns'
# values, a count column, and an amount column = count x a price per value of the priced column. So the group that
# counts the most is often not the one with the most amount, and two-step cannot be answered by one call.
table:
  # Text columns besides the priced one; sales.csv has two (month, region) besides product.
  text_columns: 2
  # Values drawn per text column, inclusive. At least 3, so compare has pairs and two-step has a runner-up; at most
  # 5, so a CSV has at most 125 rows and every group fits in one tool result (agent.max_result_rows is 20).
  values_per_column: [3, 5]
  # Counts per row, inclusive; a range like sales.csv's units.
  count: [1, 60]
  # Price per value of the priced column, in cents, inclusive; amount = count x price, written with 2 decimals.
  price_cents: [150, 4000]
# Chained arithmetic questions.
arithmetic:
  # Operations per question, inclusive: "2x2x2" has 2, "7 times 8 plus 3" has 2. One operation is the calculator task
  # the 0.6B already answers (P1.3b).
  operations: [2, 4]
  # Every number in a question, inclusive; small enough to type, large enough that results rarely repeat an operand.
  operand: [2, 20]
# Support sets per split (P2.1b): an orders CSV and a policies document attached together, as the support scenario
# attaches them (P2.1a-2). Each set holds dozens of reply questions and a few of each other support kind, so 30 and 15
# give every support kind many sets, like csvs.
support_sets:
  train: 30
  heldout: 15
# Contract pairs per split (P2.1b): two versions of one contract, as the contracts scenario attaches them (P2.1a-1).
# Each pair holds 1-2 changed clauses and 8-12 clause texts, so 30 and 15 still give clause-diff over 100 and 50
# questions with the phrasings.
contract_pairs:
  train: 30
  heldout: 15
# The shape of every generated orders CSV, like agent/tests/fixtures/orders.csv: order_id, customer, item, status,
# ordered_on, delivered_on, amount.
orders:
  # Orders per CSV, inclusive; the fixture has 4. At most 8, so a CSV stays a small attachment.
  count: [4, 8]
  # Order IDs, inclusive: four digits, like the fixture's.
  order_id: [1000, 9999]
  # The window an order is placed in, inclusive; ISO dates, as draft_reply reads them.
  ordered_on: ["2026-01-01", "2026-11-30"]
  # Days from ordering to delivery, inclusive; the fixture's are 4 and 5.
  delivery_days: [2, 6]
  # Share of orders still shipped, with no delivered_on, so some replies have no deadline (draft_reply counts only
  # from a delivery).
  shipped_share: 0.3
  # The amount of an order, in cents, inclusive; written with 2 decimals.
  amount_cents: [500, 40000]
# The shape of every generated policies document, like agent/tests/fixtures/policies.txt: a title line, then one
# "## <title>" section per policy of the split's pool.
policies:
  # Sections per document, inclusive; the fixture has 4. At least 3, so get_policy always has a choice.
  count: [3, 5]
  # The number of days in a policy's rule, inclusive: from a short shipping time to a long return window.
  rule_days: [2, 60]
# The shape of every generated contract pair, like agent/tests/fixtures/contract-2025.txt and contract-2026.txt: the
# second version is the first one, a year later, with some clause values changed.
contracts:
  # Clauses per contract, inclusive; the fixture has 5. At least 4, so extract_clauses always has a choice.
  count: [4, 6]
  # Clauses whose value the second version changes, inclusive; the fixture changes 1.
  changed: [1, 2]
# Share of off-topic questions that come with files attached: a CSV, a support set or a contract pair, so the model
# sees the off-topic reply next to every scenario's tools. Arithmetic questions never come with one: the runtime
# offers the calculator only on runs without files (P2.1a-3).
with_file_share: 0.5
# The final answer of an off-topic question, word for word, with no tool call (P1.6e's sentence, decided with the user
# 2026-10-28; orders and contracts added in P2.1b, 2026-11-01). The system prompt does not contain it: the model learns
# it from the training data.
off_topic_reply: I can only do arithmetic and answer questions about attached CSV files, orders and contracts.
# Names per split. The two splits share none, and none is a name from experiments/data/sales.csv (its file ID, columns
# or groups), so no held-out column, group or topic appears in training, and the go/no-go's file stays unseen.
pools:
  train:
    # File IDs (the model names a file by its ID); a file is <id>.csv.
    files: [shop, cafe, gym, clinic, bakery, garage, studio, hotel]
    # Text columns and their values.
    text_columns:
      city: [Berlin, Lisbon, Oslo, Prague, Vienna, Dublin, Madrid]
      channel: [Online, Phone, Store, Partner, Kiosk]
      quarter: [Q1, Q2, Q3, Q4]
      team: [Alpha, Bravo, Delta, Echo, Foxtrot]
      season: [Spring, Summer, Autumn, Winter]
    # The priced column: its value sets the price of a row.
    priced_columns:
      plan: [Basic, Plus, Pro, Team, Premium]
      dish: [Soup, Salad, Pasta, Curry, Burger]
      service: [Repair, Install, Cleaning, Checkup, Upgrade]
    # [count column, amount column] pairs.
    number_columns: [[orders, turnover], [visits, fees], [tickets, charges], [bookings, income]]
    # Off-topic questions: finetune_data.OFF_TOPIC's templates of each name are filled from the list under it.
    # Held-out has 102 template x filler combinations and training 128, so the off-topic questions of each split (14
    # and 100) are all different.
    off_topic:
      greeting: [Hi, Hello, Good morning, Hey there, Thanks, Good afternoon]
      place: [Paris, Tokyo, Nairobi, Lima, Toronto, Sydney, Istanbul, Seoul, Dakar, Oslo Fjord]
      topic: [the ocean, friendship, autumn leaves, the moon, coffee, mountains, bicycles, the stars, bread, snow]
      person: [Mozart, Marie Curie, Gandhi, Picasso, Newton, Darwin, Beethoven, Galileo]
    # Support sets: an orders CSV <orders_files>.csv and a policies document <policies_files>.txt.
    support:
      orders_files: [orders, order-list, web-orders]
      policies_files: [policies, store-rules, help-center]
      customers: [Lena Novak, Tomas Berg, Sara Lind, Jonas Weber, Mia Rossi, Luka Horvat, Nina Kral, Oskar Dahl]
      items: [Desk fan, Phone case, Coffee grinder, Yoga mat, Wall clock, Backpack, Table lamp, Water bottle]
      # Section title -> its text; {days} is the rule's number. "{days} days" is a calendar-day rule that counts from
      # the delivery, so draft_reply gives its deadline; "{days} working days" has none (agent_runtime/support.py).
      policies:
        Returns: Unused items can be returned within {days} days of delivery for a full refund.
        Damaged items: >-
          An item that arrived damaged can be replaced free of charge within {days} days of delivery. Send a photo of
          the damage with the request.
        Refunds: Refunds are paid to the original payment method within {days} working days of receiving the return.
        Shipping: Orders ship within {days} working days of payment.
        Exchanges: Items can be exchanged for another size or colour within {days} days of delivery.
        Cancellations: An order can be cancelled for free up to {days} working days after it was placed.
    # Contract pairs: <prefix>-<year>.txt and <prefix>-<year + 1>.txt, the year drawn from years, inclusive.
    contracts:
      files: [contract, agreement, service-agreement]
      years: [2015, 2020]
      # Clause title -> its text, {} the value, and the values a version draws from; the values of one clause share no
      # value with another clause's, so each clause's value names that clause alone.
      clauses:
        Termination:
          text: Either party may end this agreement with {} written notice.
          values: ["30 days'", "60 days'", "90 days'", "three months'"]
        Fees:
          text: The client pays {} per month, invoiced on the first working day of the month.
          values: ["1,200 EUR", "1,500 EUR", "2,000 EUR", "950 EUR"]
        Services:
          text: The provider delivers {} and answers data questions within two working days.
          values: [a monthly sales report, a weekly sales report, a quarterly market review, a daily stock summary]
        Confidentiality:
          text: Both parties keep the other's data confidential during the agreement and for {} after it.
          values: [two years, three years, five years, ten years]
        Liability:
          text: The provider's liability is limited to the fees of {}.
          values: [the last 12 months, the last 6 months, the last 24 months, one contract year]
        Payment terms:
          text: Invoices are due within {} of receipt.
          values: [two weeks, one month, 45 days, ten working days]
        Renewal:
          text: The agreement renews for {} unless either party objects in writing.
          values: [one more year, half a year, a further 18 months, two more years]
  heldout:
    files: [store, warehouse, school, farm, airline, museum]
    text_columns:
      store: [North Point, Riverside, Hilltop, Lakeview, Old Town, Harbor]
      department: [Toys, Books, Garden, Kitchen, Sports]
      week: [W1, W2, W3, W4, W5]
      shift: [Morning, Noon, Evening, Night]
      route: [Red, Blue, Green, Yellow]
    priced_columns:
      item: [Lamp, Chair, Desk, Shelf, Rug]
      fruit: [Apple, Mango, Pear, Plum, Cherry]
      course: [Math, Art, History, Biology, Music]
    number_columns: [[shipments, weight], [calls, minutes], [passengers, fares]]
    off_topic:
      greeting: [Good evening, Howdy, Yo, Greetings, Hiya]
      place: [Ohrid, Reykjavik, Cairo, Hanoi, Quito, Lagos, Helsinki, Havana]
      topic: [rain, music, the desert, trains, chess, volcanoes, gardens, the wind]
      person: [Tesla, Ada Lovelace, Shakespeare, Frida Kahlo, Einstein, Cleopatra]
    support:
      orders_files: [purchases, order-book, deliveries]
      policies_files: [handbook, guidelines, customer-care]
      customers: [Elif Kaya, Marta Silva, Igor Popov, Hana Sato, Pablo Ruiz, Ines Costa, Vera Holm]
      items: [Rice cooker, Bike helmet, Desk mat, Tea kettle, Camera bag, Floor rug, Night light]
      policies:
        Repairs: Faulty items are repaired free of charge within {days} days of delivery.
        Price matching: If the item is sold for less elsewhere within {days} days of delivery, we refund the difference.
        Lost parcels: A parcel that has not arrived is replaced if reported within {days} working days of dispatch.
        Late delivery: If an order takes more than {days} working days to arrive, the shipping fee is refunded.
        Trade-ins: An old device can be traded in within {days} days of delivery of the new one.
    contracts:
      files: [supply-contract, lease, licence]
      years: [2021, 2025]
      clauses:
        Warranty:
          text: The supplier repairs defects reported within {} of delivery.
          values: [six months, one year, 18 months, 90 days]
        Insurance:
          text: The supplier holds liability insurance of {} per claim.
          values: ["500,000 EUR", 1 million EUR, "250,000 EUR", 2 million EUR]
        Governing law:
          text: This contract is governed by the law of {}.
          values: [Austria, Ireland, Portugal, Norway]
        Support hours:
          text: Support is available {}.
          values: [on working days from 9 to 17, every day from 8 to 20, around the clock, on weekdays until noon]
        Data retention:
          text: Customer data is deleted {} after the contract ends.
          values: [30 days, three months, one week, 12 months]
        Penalties:
          text: A late delivery costs the supplier {} per day.
          values: [100 EUR, 250 EUR, 50 EUR, 400 EUR]
