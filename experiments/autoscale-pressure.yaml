# P4.12: KEDA scales the real vLLM pods 1<->2 on the context the active runs hold, sum(thesis_context_tokens), at one
# pod's KV cache times autoscaling.pressure_target per pod (docs/task-cards/56-P4.12-keda-on-context-tokens.md). Run
# with make experiment NAME=autoscale-pressure after make down and make up, the laptop idle (P3.10). The question: once
# the second pod was Ready, were later steps' first tokens faster than between the scale-up and Ready? The report gives
# when the context passed the threshold, when spec replicas rose, when the pods were Ready, the first scale-down, the
# three first-token medians and the KEDA operator's restarts; the series are in <stem>-pressure-autoscale.csv. One run
# in one order here; P4.5 repeats. Results carry this file's hash (D11).
profile: real
# The same replay as experiments/autoscale-real.yaml (P3.10's CPU run), so the two read side by side.
trace: results/traces/convert-apb-ca5fc26bbb1d-cd81f326aece.jsonl
pattern: burst
seed: 6
# vLLM's log line "GPU KV cache size: 4,384 tokens" for the real profile, model.kv_cache_tokens; a test holds it there.
kv_capacity_tokens_per_pod: 4384
warmup:
  # The runs that start before the first burst at 120 s, 4 at seed 6; a test holds it to autoscale-real.yaml's. Their
  # calls are left out of the call rows and the windows, not of the series: their context is load KEDA scales on.
  runs_discarded: 4
  # As experiments/baseline.yaml, whose warm-up times showed 5 calls enough (P2.5, Gate 2).
  calls_per_pod: 5
  words: 200
  completion_tokens: 16
# As experiments/autoscale-real.yaml: a replay in which a pod with calls made no tokens for six 5 s scrapes is refused,
# since the GPU-sharing stalls of 2026-11-12 (P3.7) would read as the autoscaler's result. The second pod shares the GPU.
pod_stall_seconds: 30
# On the default picker: autoscaling does not depend on the plugin (D2). It starts at autoscaling.min_replicas.
variants:
  - name: pressure
    values: null
    epp_config: default-plugins.yaml
    autoscaler: pressure
