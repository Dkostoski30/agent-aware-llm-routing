# Defaults for the parts that are not in config/. make experiment hands the rest from the profile's autoscaling
# section, through loadgen/load_generator/autoscale.py's helm_values (D11): minReplicas, maxReplicas, query, threshold
# and scaleDownStabilizationSeconds. The template refuses to render without them.

# kube-prometheus-stack's Prometheus under make up's release name, monitoring (infra/install-monitoring.sh), as the
# experiment's own range queries reach it.
prometheusAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
