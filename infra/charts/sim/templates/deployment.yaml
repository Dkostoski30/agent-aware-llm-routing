# Named and labelled like the vllm chart's Deployment, so the InferencePool, the PodMonitor, make experiment's restart and
# make replay's /tokenize find these pods unchanged (P2.7).
{{- /* The drain of P4.3 (docs/task-cards/59-P4.3-drain.md), from the profile's drain section. */}}
{{- $drain := required "drain from the profile" .Values.drain }}
{{- if not (kindIs "bool" $drain.enabled) }}
{{- fail (printf "drain.enabled from the profile must be true or false, got %v" $drain.enabled) }}
{{- end }}
{{- $timeout := $drain.timeout_seconds }}
{{- if not (and (or (kindIs "float64" $timeout) (kindIs "int64" $timeout)) (gt (float64 $timeout) 0.0) (eq (float64 $timeout) (floor $timeout))) }}
{{- fail (printf "drain.timeout_seconds from the profile must be a whole number of seconds above 0, got %v" $timeout) }}
{{- end }}
{{- $quiet := $drain.quiet_seconds }}
{{- if not (and (or (kindIs "float64" $quiet) (kindIs "int64" $quiet)) (ge (float64 $quiet) 0.0) (eq (float64 $quiet) (floor $quiet))) }}
{{- fail (printf "drain.quiet_seconds from the profile must be a whole number of seconds, 0 or more, got %v" $quiet) }}
{{- end }}
{{- $image := "" }}
{{- if $drain.enabled }}
{{- $image = required "drainImage, the picker's image that carries the waiter, set by make vllm-deploy or make sim-deploy" .Values.drainImage }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: {{ required "replicas from the profile" .Values.replicas }}
  # As in the vllm chart, so make experiment's restart replaces every pod at once and no old pod serves during it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      {{- if $drain.enabled }}
      # Kubernetes counts the preStop hook inside this, so the server's own exit gets the margin after the drain.
      terminationGracePeriodSeconds: {{ add (int64 $timeout) .Values.drainExitMarginSeconds }}
      # The waiter (gateway/cmd/drainwait), copied out of the picker's image, which k3s has from make up. The image has
      # no shell and no cp, so the waiter copies itself.
      initContainers:
        - name: drainwait
          image: {{ $image }}
          imagePullPolicy: Never
          command: ["/app/drainwait", "install", "/drain/drainwait"]
          volumeMounts:
            - name: drain
              mountPath: /drain
      {{- end }}
      containers:
        - name: sim
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          args:
            # The same name as "real" without an adapter, which is the name make replay asks for on this profile.
            - --model={{ required "model.name from the profile" .Values.model.name }}
            - --port=8000
            - --max-model-len={{ required "model.max_model_len from the profile" .Values.model.max_model_len }}
            - --max-num-seqs={{ required "simulator.max_num_seqs from the profile" .Values.simulator.max_num_seqs }}
            # Time to first token grows with the uncached prompt tokens, which D4 needs. "constant" ignores cache hits.
            - --latency-calculator=per-token
            - --prefill-overhead={{ required "simulator.prefill_overhead from the profile" .Values.simulator.prefill_overhead }}
            - --prefill-time-per-token={{ required "simulator.prefill_time_per_token from the profile" .Values.simulator.prefill_time_per_token }}
            - --inter-token-latency={{ required "simulator.inter_token_latency from the profile" .Values.simulator.inter_token_latency }}
            - --time-factor-under-load={{ required "simulator.time_factor_under_load from the profile" .Values.simulator.time_factor_under_load }}
            - --startup-duration={{ required "simulator.startup_duration from the profile" .Values.simulator.startup_duration }}
            - --seed={{ required "simulator.seed from the profile" .Values.simulator.seed }}
            - --enable-kvcache
            - --kv-cache-size={{ required "simulator.kv_cache_blocks from the profile" .Values.simulator.kv_cache_blocks }}
            - --block-size={{ required "simulator.block_size from the profile" .Values.simulator.block_size }}
            # Empty turns off the KV-cache events, which only a precise prefix scorer reads; the picker's prefix scorer
            # estimates from the requests it routes. The default endpoint would redial forever with nobody listening.
            - --zmq-endpoint=
          env:
            # The simulator names the pod in each reply's x-inference-pod header, which make replay records.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # --enable-kvcache refuses to start without it, although it is used only in the events' topic.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          {{- if $drain.enabled }}
          # Before SIGTERM: holds the pod until its running and waiting calls have been 0 for drain.quiet_seconds, or
          # drain.timeout_seconds pass. The picker has dropped the pod from its pool by then, so nothing new comes.
          lifecycle:
            preStop:
              exec:
                command:
                  - /drain/drainwait
                  - wait
                  - --metrics=http://127.0.0.1:8000/metrics
                  - --timeout={{ int64 $timeout }}s
                  - --quiet={{ int64 $quiet }}s
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              # 503 until --startup-duration has passed, which is the simulated cold start (D4); /health is 200 at once.
              path: /health/ready
              port: http
            # As in the vllm chart: a pod joins the Service within 5 s of finishing its start.
            periodSeconds: 5
          {{- if $drain.enabled }}
          volumeMounts:
            - name: drain
              mountPath: /drain
              readOnly: true
          {{- end }}
      {{- if $drain.enabled }}
      volumes:
        - name: drain
          emptyDir: {}
      {{- end }}
