# Defaults for the parts that are not in config/sim.yaml. make sim-deploy renders the profile's model, replicas,
# simulator and monitoring sections on top of these (D11).

# v1.0.0 (2026-10-15), the newest release at least two weeks old on 2026-11-05 (versions.md).
image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0@sha256:1908c421cbb44130a3212934a0dd1e279dacfe3480be93f4c28b45cd29b93ec8

# How long Kubernetes gives a pod to exit after its drain (P4.3), on top of drain.timeout_seconds: an infra wait, not a
# tunable. On SIGTERM llm-d-inference-sim v1.0.0 waits up to 30 s for its open calls, which an idle pod has none of,
# then up to 5 s for its HTTP server (pkg/communication/communication.go), so 35 s lets a pod the timeout cut short
# finish its own shutdown.
drainExitMarginSeconds: 35

# The picker's image, which carries the drain waiter (infra/picker-image.sh --tag); set by make sim-deploy.
drainImage: ""

# Filled from config/sim.yaml by make sim-deploy.
replicas: 0
model: {}
simulator: {}
monitoring: {}
drain: {}
