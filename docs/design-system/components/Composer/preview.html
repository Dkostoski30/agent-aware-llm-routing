<!-- @dsCard group="Conversation" height=300 subtitle="New task, follow-up, disabled while running" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composer</title>
<style>
  html, body { margin: 0; }
  body { background: var(--bg); }
  .ag-root{padding:20px;max-width:760px}
</style>
</head>
<body>
<div id="root" class="ag-root"></div>
<script>
  var A = window.AgentUI;
  document.getElementById('root').innerHTML =
    A.composer({"hero": true, "placeholder": "Describe the task, or start from a scenario below", "scenario": "Contracts", "source": "contract_a.md · contract_b.md"}) + '<div style="height:16px"></div>' +
    A.composer({"scenario": "Contracts", "placeholder": "Ask a follow-up"}) + '<div style="height:16px"></div>' + A.composer({"scenario": "Contracts", "placeholder": "Ask a follow-up", "disabled": true, "hint": "Available when the run finishes"});
</script>
</body>
</html>
