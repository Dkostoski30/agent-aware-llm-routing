<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; }
  .art svg { display: block; width: 480px; height: 288px; }
  .accent { fill: var(--accent); }
  .soft { fill: var(--accent-soft); }
  .ink { fill: var(--ink); }
  .amber { fill: var(--draining); }
  .cut { fill: var(--bg); }
  .blk { rx: var(--radius-md); }
  .small { rx: var(--radius-xs); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 120px; line-height: .9; font-weight: 700; letter-spacing: -.03em; color: var(--ink); }
  .tag { margin: var(--space-3) 0 0 6px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>

  arrangement one tall accent slab with satellites, bottoms on one line space-12 above the edge, space-4 gutters
  pattern     square pixels, from the 8-bit horse and the "pixels stay square" rule: a burst's remaining work as a pixel bar chart cut out of the slab in bg, one column per sample
  scales      gutters space-4; pixels space-2 square at a space-3 pitch, inset space-6; blocks radius-md, satellite radius-xs, pixels square
