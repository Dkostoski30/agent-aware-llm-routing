[project]
name = "thesis"
version = "0.1.0"
description = "LLM call routing and vLLM autoscaling on Kubernetes (FCSE bachelor thesis)"
# The Python that Ubuntu 24.04 ships; uv uses it instead of downloading another one.
requires-python = "==3.12.*"
# The components, so one uv sync installs what every test needs.
dependencies = ["agent", "app", "loadgen"]

[tool.uv.workspace]
members = ["agent", "app", "loadgen"]

[tool.uv.sources]
agent = { workspace = true }
app = { workspace = true }
loadgen = { workspace = true }

[dependency-groups]
dev = [
    # Its pytest plugin runs the async agent tests; httpx depends on it too.
    "anyio==4.15.1",
    # FastAPI's TestClient runs on it (the app tests, P2.10a); the agent's pin, already in uv.lock.
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
# The repo is a set of components, not one installable package.
package = false

[tool.pytest.ini_options]
# Test files in different components may share a basename (e.g. test_config.py) without clashing.
# training/ has its own environment with torch (P1.7); make test runs its tests there.
addopts = ["--import-mode=importlib", "--strict-markers", "--ignore=training"]
# importlib mode does not put a test's directory on sys.path; scripts tested in place and the directories that hold
# a component's package (agent/, app/, loadgen/ and sim/ are not installed, they have no build backend) are listed
# here.
pythonpath = ["infra/checks", "agent", "app", "experiments", "loadgen", "sim"]

[tool.ruff]
target-version = "py312"
# Wide enough for descriptive names in table-driven tests without wrapping every case.
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify and ruff's own rules.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# Finds agent_runtime, app_backend, the experiment scripts, loadgen and sim's calibrator when pre-commit passes only a
# test file that imports them.
mypy_path = "agent:app:experiments:loadgen:sim"
