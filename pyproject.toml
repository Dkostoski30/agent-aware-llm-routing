[project]
name = "thesis"
version = "0.1.0"
description = "LLM call routing and vLLM autoscaling on Kubernetes (FCSE bachelor thesis)"
# The Python that Ubuntu 24.04 ships; uv uses it instead of downloading another one.
requires-python = "==3.12.*"
# The components, so one uv sync installs what every test needs.
dependencies = ["agent"]

[tool.uv.workspace]
members = ["agent"]

[tool.uv.sources]
agent = { workspace = true }

[dependency-groups]
dev = [
    # Its pytest plugin runs the async agent tests; httpx depends on it too.
    "anyio==4.15.1",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
# The repo is a set of components, not one installable package.
package = false

[tool.pytest.ini_options]
# Test files in different components may share a basename (e.g. test_config.py) without clashing.
addopts = ["--import-mode=importlib", "--strict-markers"]
# importlib mode does not put a test's directory on sys.path; scripts tested in place and the directories that hold
# a component's package (agent/ is not installed, it has no build backend) are listed here.
pythonpath = ["infra/checks", "agent", "experiments"]

[tool.ruff]
target-version = "py312"
# Wide enough for descriptive names in table-driven tests without wrapping every case.
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify and ruff's own rules.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# Finds agent_runtime and the experiment scripts when pre-commit passes only a test file that imports them.
mypy_path = "agent:experiments"
